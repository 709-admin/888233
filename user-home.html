<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f5f7f6" />
<title>工作台 · 709管理平台</title>
<style>
:root{--ink:#1c2924;--muted:#74817b;--line:#e3e9e5;--green:#176b54;--canvas:#f5f7f6;--paper:#fff;--red:#b84840}*{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,select{font:inherit;cursor:pointer}.topbar{display:flex;align-items:center;justify-content:space-between;min-height:68px;padding:0 clamp(18px,5vw,64px);border-bottom:1px solid var(--line);background:#fff}.brand{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:650}.brand-mark{display:grid;width:31px;height:31px;place-items:center;border:1px solid var(--green);border-radius:8px;color:var(--green)}.brand-mark svg{width:18px;height:18px}.user-menu{display:flex;align-items:center;gap:10px;color:#56635d;font-size:13px}.avatar{display:grid;width:32px;height:32px;place-items:center;border-radius:50%;background:#dcece3;color:var(--green);font-weight:700}.logout{min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#55625b;font-size:12px}.logout:hover{border-color:#aac9b7;color:var(--green)}main{width:min(100% - 40px,1000px);margin:0 auto;padding:52px 0}.welcome{padding:0 0 28px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 10px;color:var(--green);font-size:11px;font-weight:700;letter-spacing:.1em}.welcome h1{margin:0;font-size:28px;font-weight:650}.welcome p:last-child{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}.section-title{margin:29px 0 13px;font-size:14px;font-weight:650}.account{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);background:var(--paper)}.item{min-height:78px;padding:17px 19px;border-bottom:1px solid #edf1ef}.item:nth-child(odd){border-right:1px solid #edf1ef}.item:nth-last-child(-n+2){border-bottom:0}.label{color:var(--muted);font-size:11px}.value{margin-top:7px;color:var(--ink);font-size:13px;overflow-wrap:anywhere}.role-tag{display:inline-flex;align-items:center;min-height:23px;padding:0 8px;background:#edf6f0;color:var(--green);font-size:11px}.notice{margin-top:18px;padding:15px 17px;border-left:3px solid #78aa87;background:#eef5f0;color:#586a5e;font-size:12px;line-height:1.7}.error{color:var(--red);font-size:13px}.workspace-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:16px}.business-panel{border:1px solid var(--line);background:var(--paper)}.panel-head{padding:18px 20px 14px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:15px;font-weight:650}.panel-head p{margin:6px 0 0;color:var(--muted);font-size:12px}.panel-body{padding:19px 20px}.field-label{display:block;margin:0 0 8px;color:#56645d;font-size:12px;font-weight:600}.app-select{width:100%;height:42px;padding:0 12px;border:1px solid #dce4df;border-radius:4px;outline:none;background:#fff;color:var(--ink);font-size:13px}.app-select:focus{border-color:#39846e;box-shadow:0 0 0 3px rgba(23,107,84,.1)}.duration-title{margin:22px 0 10px;color:#56645d;font-size:12px;font-weight:600}.duration-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.duration{min-height:48px;padding:6px 3px;border:1px solid #dce4df;border-radius:4px;background:#fff;color:#58655e;font-size:12px}.duration small{display:block;margin-top:4px;color:#a0aaa5;font-size:10px}.duration:hover,.duration.active{border-color:#5aa07e;background:#f0f8f2;color:var(--green)}.duration.active small{color:#5b9975}.generate-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid #edf1ef}.price{color:var(--muted);font-size:12px}.price strong{color:var(--ink);font-size:19px}.generate{min-height:40px;padding:0 17px;border:0;border-radius:4px;background:var(--green);color:#fff;font-size:13px;font-weight:650}.generate:hover{background:#105640}.generate:disabled{background:#a7b5ae;cursor:not-allowed}.balance{display:flex;min-height:100%;flex-direction:column;justify-content:space-between}.balance-amount{margin:20px 0 0;color:var(--ink);font-size:34px;font-weight:650}.balance-amount small{margin-left:4px;color:var(--muted);font-size:12px;font-weight:400}.balance-note{margin:9px 0 0;color:var(--muted);font-size:11px;line-height:1.7}.balance-action{display:block;width:100%;min-height:38px;margin-top:28px;border:1px solid #cfe1d6;border-radius:4px;background:#f4faf6;color:var(--green);font-size:12px}.balance-action:hover{background:#e8f4ec}.result{display:none;margin-top:16px;padding:13px 15px;border:1px solid #d5e9dc;background:#f3faf5;color:#496455;font-size:12px;line-height:1.6}.result.show{display:block}.demo-tip{margin-top:12px;color:#9a6d45;font-size:11px;line-height:1.6}@media(max-width:720px){.topbar{min-height:60px;padding:0 16px}.brand{font-size:13px}.user-menu{gap:7px;font-size:12px}main{width:calc(100% - 32px);padding:35px 0}.welcome h1{font-size:24px}.account{grid-template-columns:1fr}.item{min-height:68px;border-right:0!important;border-bottom:1px solid #edf1ef!important}.item:last-child{border-bottom:0!important}.item:nth-last-child(2){border-bottom:1px solid #edf1ef!important}.workspace-grid{grid-template-columns:1fr;gap:14px}.duration-grid{grid-template-columns:repeat(2,1fr)}.panel-body{padding:17px}.generate-row{align-items:stretch;flex-direction:column}.generate{width:100%}.balance-action{margin-top:20px}}
.card-modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:20px;background:rgba(18,38,30,.48)}.card-modal.open{display:grid}.card-dialog{width:min(100%,460px);padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 18px 60px rgba(16,36,29,.2)}.card-dialog h2{margin:0;font-size:18px;font-weight:650}.card-dialog p{margin:7px 0 0;color:var(--muted);font-size:12px}.card-value{margin-top:20px;padding:16px;border:1px solid #dce7df;border-radius:6px;background:#f5f9f6;color:var(--ink);font-family:ui-monospace,Consolas,monospace;font-size:15px;line-height:1.7;overflow-wrap:anywhere;user-select:all}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.card-actions button{min-height:42px;border-radius:6px;font-size:13px;font-weight:600}.copy-card{border:1px solid #cfe1d6;background:#fff;color:var(--green)}.copy-card:hover{background:#f1f8f3}.continue-card{border:0;background:var(--green);color:#fff}.continue-card:hover{background:#105640}@media(max-width:480px){.card-dialog{padding:20px}.card-actions{grid-template-columns:1fr}}
.contact-button{min-height:36px;padding:0 12px;border:1px solid #cfe1d6;border-radius:4px;background:#f4faf6;color:var(--green);font-size:12px;font-weight:600}.contact-button:hover{background:#e8f4ec}.contact-modal{position:fixed;inset:0;z-index:21;display:none;place-items:center;padding:20px;background:rgba(18,38,30,.48)}.contact-modal.open{display:grid}.contact-dialog{width:min(100%,420px);padding:24px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:0 18px 60px rgba(16,36,29,.2)}.contact-dialog h2{margin:0;font-size:18px}.contact-copy{margin:9px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.contact-details{margin-top:18px;padding:15px;border:1px solid #dce7df;border-radius:6px;background:#f5f9f6;color:var(--ink);font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.contact-close{width:100%;min-height:40px;margin-top:18px;border:0;border-radius:5px;background:var(--green);color:#fff;font-size:13px;font-weight:600}.contact-close:hover{background:#105640}@media(max-width:480px){.contact-dialog{padding:20px}}
@media(max-width:560px){.user-menu{gap:6px}.user-menu #userName{display:none}.contact-button{padding:0 8px}}
.section-title,.account,.notice{display:none}
.history-panel{width:min(100% - 40px,1000px);margin:18px auto 0;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}.history-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line)}.history-head h2{margin:0;font-size:15px;font-weight:650}.history-filter{width:min(220px,48%);height:38px;padding:0 34px 0 11px;border:1px solid #dce4df;border-radius:5px;outline:none;background:#fff;color:var(--ink);font-size:12px}.history-filter:focus{border-color:#39846e;box-shadow:0 0 0 3px rgba(23,107,84,.1)}.history-table-wrap{overflow-x:auto}.history-table{width:100%;min-width:560px;border-collapse:collapse;text-align:left}.history-table th{height:38px;padding:0 16px;background:#fbfcfb;color:#85918b;font-size:11px;font-weight:600}.history-table td{height:52px;padding:9px 16px;border-top:1px solid #edf1ef;color:#435149;font-size:12px;overflow-wrap:anywhere}.history-key{font-family:ui-monospace,Consolas,monospace;color:var(--green)!important;cursor:pointer}.history-key:hover{text-decoration:underline}.history-empty{padding:28px 16px;color:var(--muted);font-size:12px;text-align:center}.history-copy-status{min-height:0;padding:0 16px;color:var(--green);font-size:12px}.history-copy-status:not(:empty){padding-top:9px;padding-bottom:9px}.history-pagination{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:10px 16px;border-top:1px solid #edf1ef;color:var(--muted);font-size:11px}.history-pagination button{min-width:30px;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:#fff;color:#526159;font-size:12px}.history-pagination button:hover:not(:disabled){border-color:#a9cbb7;color:var(--green)}.history-pagination button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:560px){.history-panel{width:calc(100% - 32px)}.history-head{align-items:stretch;flex-direction:column}.history-filter{width:100%}}
.workspace-grid{display:block;position:relative}
.business-panel{border-radius:8px;overflow:hidden}
.workspace-grid>section{width:100%}
.workspace-grid>aside{position:absolute;top:-112px;right:0;width:220px;min-height:0}
.workspace-grid>aside .panel-head{padding:10px 14px;border-bottom:0}
.workspace-grid>aside .panel-head h2{font-size:12px}
.workspace-grid>aside .panel-head p{display:none}
.workspace-grid>aside .panel-body{padding:0 14px 12px}
.workspace-grid>aside .balance-amount{margin:0;font-size:23px}
.workspace-grid>aside .balance-note{display:none}
@media(max-width:720px){.workspace-grid>aside{position:static;width:100%;margin-top:14px}.workspace-grid>aside .panel-head{padding:16px 17px 10px}.workspace-grid>aside .panel-head h2{font-size:15px}.workspace-grid>aside .panel-head p{display:block}.workspace-grid>aside .panel-body{padding:0 17px 16px}.workspace-grid>aside .balance-amount{font-size:30px}.workspace-grid>aside .balance-note{display:block}}
@media(max-width:560px){.topbar{min-height:58px;padding:0 12px;gap:8px}.brand{gap:6px;font-size:12px;white-space:nowrap}.brand-mark{width:28px;height:28px}.user-menu{gap:5px}.user-menu #userName{display:none}.contact-button{min-height:34px;padding:0 8px;font-size:11px}.avatar{width:28px;height:28px;flex:0 0 28px}.logout{min-height:34px;padding:0 8px;font-size:11px}main{width:calc(100% - 32px);padding:30px 0}.welcome{padding-bottom:20px}.welcome h1{font-size:24px;overflow-wrap:anywhere}.workspace-grid>section .panel-body{padding:16px}.duration-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.duration{min-height:48px}.generate-row{align-items:stretch;flex-direction:column}.generate{width:100%;min-height:44px}.history-panel{margin-top:14px}.history-table th,.history-table td{padding-left:10px;padding-right:10px}.history-pagination{flex-wrap:wrap;justify-content:space-between;gap:6px}.card-modal,.contact-modal{padding:12px}.card-dialog,.contact-dialog{max-height:calc(100dvh - 24px);overflow:auto}.card-actions{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.brand{font-size:11px}.brand-mark{width:25px;height:25px}.user-menu{gap:4px}.contact-button,.logout{padding:0 6px;font-size:10px}.card-actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M12 3v18M5 8l7 4 7-4M5 16l7-4 7 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>709管理平台</span></div><div class="user-menu"><button class="contact-button" id="contactButton" type="button">充值联系</button><div class="avatar" id="avatar">用</div><span id="userName">正在验证…</span><button class="logout" id="logout" type="button">退出登录</button></div></header>
<main><section class="welcome"><p class="eyebrow">WORKSPACE</p><h1 id="welcomeTitle">欢迎回来</h1><p>个人卡密工作台</p></section><div class="workspace-grid"><section class="business-panel"><div class="panel-head"><h2>提取应用卡密</h2><p>选择应用和卡密时长，余额将按对应售价扣除</p></div><div class="panel-body"><label class="field-label" for="application">选择应用</label><select class="app-select" id="application"><option value="">正在加载应用…</option></select><h3 class="duration-title">选择卡密时长</h3><div class="duration-grid" id="durations"></div><div class="generate-row"><div class="price">应付金额 <strong id="price">¥0.00</strong></div><button class="generate" id="generate" type="button" disabled>提取卡密</button></div><div class="result" id="result" aria-live="polite"></div><p class="error" id="error" role="alert"></p></div></section><aside class="business-panel"><div class="panel-head"><h2>钱包余额</h2><p>账户可用余额</p></div><div class="panel-body balance"><div><div class="balance-amount">¥<span id="balance">0.00</span></div><p class="balance-note">需要充值时，请使用页面右上角的联系方式。</p></div></div></aside></div><h2 class="section-title">账号信息</h2><section class="account"><div class="item"><div class="label">姓名</div><div class="value" id="nameValue">-</div></div><div class="item"><div class="label">登录邮箱</div><div class="value" id="emailValue">-</div></div><div class="item"><div class="label">账号角色</div><div class="value"><span class="role-tag" id="roleValue">-</span></div></div><div class="item"><div class="label">账号状态</div><div class="value">正常</div></div></section><div class="notice" id="roleNotice">页面权限根据你的账号角色提供。</div></main>
  <section class="history-panel"><div class="history-head"><h2>卡密提取记录</h2><select class="history-filter" id="historyFilter" aria-label="按应用筛选"><option value="all">全部应用</option></select></div><div id="historyContent"><div class="history-empty">正在加载记录…</div></div><div class="history-copy-status" id="historyCopyStatus" aria-live="polite"></div></section>
 <div class="card-modal" id="cardModal" role="presentation"><section class="card-dialog" role="dialog" aria-modal="true" aria-labelledby="cardModalTitle"><h2 id="cardModalTitle">卡密提取成功</h2><p id="cardMeta"></p><div class="card-value" id="cardValue" tabindex="0"></div><div class="card-actions"><button class="copy-card" id="copyCard" type="button">复制卡密</button><button class="continue-card" id="continueCard" type="button">继续生成</button></div></section></div>
<div class="contact-modal" id="contactModal" role="presentation"><section class="contact-dialog" role="dialog" aria-modal="true" aria-labelledby="contactTitle"><h2 id="contactTitle">管理员联系方式</h2><p class="contact-copy">如需充值，请通过以下方式联系管理员。</p><div class="contact-details" id="contactDetails">管理员暂未设置联系方式，请稍后再试。</div><button class="contact-close" id="closeContact" type="button">关闭</button></section></div>
<script>
const token=sessionStorage.getItem('senxu-token');
const durations=['小时卡','天卡','周卡','月卡','季卡','半年卡','年卡','永久卡'];
let applications=[],selectedDuration='';
const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
const appSelect=document.getElementById('application'), durationRoot=document.getElementById('durations');
function updatePrice(){const app=applications.find(item=>String(item.id)===appSelect.value);durationRoot.querySelectorAll('[data-duration]').forEach(button=>{const value=app?.prices?.[button.dataset.duration];button.querySelector('small').textContent=value===undefined?'未开放':`¥${Number(value).toFixed(2)}`;button.disabled=value===undefined;});const price=app?.prices?.[selectedDuration];document.getElementById('price').textContent=price!==undefined?`¥${Number(price).toFixed(2)}`:'暂不可用';document.getElementById('generate').disabled=!app||price===undefined||!selectedDuration;}
async function loadWorkspace(){if(!token){window.location.href='index.html';return;}const response=await fetch('/api/auth/me',{headers});const data=await response.json();if(!response.ok)throw new Error(data.message||'登录状态已失效');const user=data.user;document.getElementById('userName').textContent=user.name;document.getElementById('avatar').textContent=user.name.slice(0,1);document.getElementById('welcomeTitle').textContent=`欢迎回来，${user.name}`;document.getElementById('nameValue').textContent=user.name;document.getElementById('emailValue').textContent=user.email;document.getElementById('roleValue').textContent=user.role;document.getElementById('balance').textContent=Number(user.balance||0).toFixed(2);document.getElementById('roleNotice').textContent=user.role==='访客'?'你当前使用访客权限，可提取开放给访客的卡密。':'你当前使用成员权限，可提取工作区开放的卡密。';const appsResponse=await fetch('/api/apps',{headers});const appsData=await appsResponse.json();if(!appsResponse.ok)throw new Error(appsData.message||'应用加载失败');applications=appsData.applications;appSelect.innerHTML='<option value="">请选择应用</option>'+applications.map(app=>`<option value="${app.id}">${app.name.replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}</option>`).join('');durationRoot.innerHTML=durations.map((duration,index)=>`<button class="duration${index===0?' active':''}" type="button" data-duration="${duration}">${duration}<small>选择应用查看价格</small></button>`).join('');selectedDuration=durations[0];updatePrice();try{const contactResponse=await fetch('/api/settings/recharge-contact',{headers});const contactData=await contactResponse.json();if(contactResponse.ok)document.getElementById('contactDetails').textContent=contactData.contact||'管理员暂未设置联系方式，请稍后再试。';}catch(_){}}
durationRoot.addEventListener('click',event=>{const button=event.target.closest('[data-duration]');if(!button)return;selectedDuration=button.dataset.duration;durationRoot.querySelectorAll('.duration').forEach(item=>item.classList.toggle('active',item===button));updatePrice();});
appSelect.addEventListener('change',updatePrice);
function escapeText(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
let historyPage=1,historyRecords=[];
async function loadHistory(resetPage=true){const host=document.getElementById('historyContent');host.innerHTML='<div class="history-empty">正在加载记录…</div>';if(resetPage)historyPage=1;try{const selected=document.getElementById('historyFilter').value;const response=await fetch(`/api/cards/history?applicationId=${encodeURIComponent(selected)}`,{headers});const data=await response.json();if(!response.ok)throw new Error(data.message||'记录加载失败');historyRecords=data.records;if(!historyRecords.length){host.innerHTML='<div class="history-empty">暂无卡密提取记录</div>';return;}const pageCount=Math.ceil(historyRecords.length/10);historyPage=Math.min(historyPage,pageCount);const start=(historyPage-1)*10;const pageRecords=historyRecords.slice(start,start+10);host.innerHTML=`<div class="history-table-wrap"><table class="history-table"><thead><tr><th>应用</th><th>时长</th><th>卡密</th><th>提取时间</th></tr></thead><tbody>${pageRecords.map(record=>`<tr><td>${escapeText(record.application)}</td><td>${escapeText(record.duration)}</td><td class="history-key" data-card-key="${escapeText(record.cardKey)}" title="点击复制卡密">${escapeText(record.cardKey)}</td><td>${record.soldAt?new Date(record.soldAt).toLocaleString('zh-CN',{hour12:false}):'-'}</td></tr>`).join('')}</tbody></table></div><div class="history-pagination"><span>共 ${historyRecords.length} 条，第 ${historyPage}/${pageCount} 页</span><button type="button" data-history-page="prev" ${historyPage===1?'disabled':''}>上一页</button><button type="button" data-history-page="next" ${historyPage===pageCount?'disabled':''}>下一页</button></div>`;}catch(error){host.innerHTML=`<div class="history-empty">${escapeText(error.message)}</div>`;}}
document.getElementById('historyFilter').addEventListener('change',loadHistory);
document.getElementById('historyContent').addEventListener('click',async event=>{const key=event.target.closest('[data-card-key]');const pager=event.target.closest('[data-history-page]');if(pager){historyPage+=pager.dataset.historyPage==='next'?1:-1;const host=document.getElementById('historyContent');const selected=document.getElementById('historyFilter').value;const pageCount=Math.ceil(historyRecords.length/10);historyPage=Math.max(1,Math.min(historyPage,pageCount));const slice=historyRecords.slice((historyPage-1)*10,historyPage*10);host.innerHTML=`<div class="history-table-wrap"><table class="history-table"><thead><tr><th>应用</th><th>时长</th><th>卡密</th><th>提取时间</th></tr></thead><tbody>${slice.map(record=>`<tr><td>${escapeText(record.application)}</td><td>${escapeText(record.duration)}</td><td class="history-key" data-card-key="${escapeText(record.cardKey)}" title="点击复制卡密">${escapeText(record.cardKey)}</td><td>${record.soldAt?new Date(record.soldAt).toLocaleString('zh-CN',{hour12:false}):'-'}</td></tr>`).join('')}</tbody></table></div><div class="history-pagination"><span>共 ${historyRecords.length} 条，第 ${historyPage}/${pageCount} 页</span><button type="button" data-history-page="prev" ${historyPage===1?'disabled':''}>上一页</button><button type="button" data-history-page="next" ${historyPage===pageCount?'disabled':''}>下一页</button></div>`;return;}if(!key)return;const value=key.dataset.cardKey;try{await navigator.clipboard.writeText(value);}catch(_){const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied){document.getElementById('historyCopyStatus').textContent='复制失败，请手动选择卡密';return;}}const status=document.getElementById('historyCopyStatus');status.textContent='卡密已复制';clearTimeout(status.timer);status.timer=setTimeout(()=>status.textContent='',1800);});
const cardModal=document.getElementById('cardModal');
function closeCardModal(){cardModal.classList.remove('open');document.getElementById('generate').focus();}
document.getElementById('generate').addEventListener('click',async event=>{const button=event.currentTarget;button.disabled=true;button.textContent='正在提取…';document.getElementById('error').textContent='';try{const response=await fetch('/api/cards/redeem',{method:'POST',headers,body:JSON.stringify({applicationId:appSelect.value,duration:selectedDuration})});const data=await response.json();if(!response.ok)throw new Error(data.message||'提取失败');document.getElementById('balance').textContent=Number(data.balance).toFixed(2);document.getElementById('cardMeta').textContent=`${data.application} · ${data.duration} · ¥${Number(data.price).toFixed(2)}`;document.getElementById('cardValue').textContent=data.cardKey;document.getElementById('copyCard').textContent='复制卡密';cardModal.classList.add('open');document.getElementById('copyCard').focus();loadHistory();}catch(error){document.getElementById('error').textContent=error.message;}finally{button.textContent='提取卡密';updatePrice();}});
document.getElementById('continueCard').addEventListener('click',closeCardModal);
document.getElementById('copyCard').addEventListener('click',async event=>{const button=event.currentTarget;const value=document.getElementById('cardValue').textContent;try{await navigator.clipboard.writeText(value);}catch(_){const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const copied=document.execCommand('copy');field.remove();if(!copied)throw new Error('复制失败，请手动选择卡密复制');}button.textContent='已复制';});
cardModal.addEventListener('click',event=>{if(event.target===cardModal)closeCardModal();});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&cardModal.classList.contains('open'))closeCardModal();if(event.key==='Escape'&&contactModal.classList.contains('open'))contactModal.classList.remove('open');});
loadWorkspace().then(()=>{const filter=document.getElementById('historyFilter');filter.innerHTML='<option value="all">全部应用</option>'+applications.map(app=>`<option value="${app.id}">${escapeText(app.name)}</option>`).join('');return loadHistory();}).catch(error=>{document.getElementById('error').textContent=error.message;if(/失效|重新登录/.test(error.message)){sessionStorage.removeItem('senxu-token');setTimeout(()=>window.location.href='index.html',1300);}});
document.getElementById('logout').addEventListener('click',()=>{sessionStorage.removeItem('senxu-token');sessionStorage.removeItem('senxu-current-user');window.location.href='index.html';});
const contactModal=document.getElementById('contactModal');
document.getElementById('contactButton').addEventListener('click',()=>contactModal.classList.add('open'));
document.getElementById('closeContact').addEventListener('click',()=>contactModal.classList.remove('open'));
contactModal.addEventListener('click',event=>{if(event.target===contactModal)contactModal.classList.remove('open');});
</script>
</body>
</html>
